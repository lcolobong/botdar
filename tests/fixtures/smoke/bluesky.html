<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bluesky (Botdar smoke placeholder)</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0b0f14;
        --muted: #42576c;
        --border: #d4dbe2;
      }
      html[data-theme="dark"] {
        --bg: #161e27;
        --fg: #f1f3f5;
        --muted: #8b98a5;
        --border: #2e4052;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.4 -apple-system,
          "Segoe UI",
          Helvetica,
          Arial,
          sans-serif;
      }
      main {
        max-width: 600px;
        margin: 0 auto;
      }
      [data-testid^="feedItem-by-"] {
        display: flex;
        gap: 10px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: #a8c7e6;
        flex: none;
      }
      .author {
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      .author a {
        color: inherit;
        text-decoration: none;
        font-weight: 600;
      }
      .author a + a {
        color: var(--muted);
        font-weight: 400;
      }
      p {
        margin: 4px 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-size: 20px; padding: 12px 16px; margin: 0">Discover</h1>
      <div data-testid="feedItem-by-newsfeed7781.bsky.social">
        <div class="avatar"></div>
        <div>
          <div class="author">
            <a href="/profile/newsfeed7781.bsky.social">Headlines Now</a>
            <a href="/profile/newsfeed7781.bsky.social">@newsfeed7781.bsky.social</a>
          </div>
          <p>
            Breaking: markets open higher as traders weigh the latest figures. More at the link.
          </p>
        </div>
      </div>
      <div data-testid="feedItem-by-anneke.bsky.social">
        <div class="avatar"></div>
        <div>
          <div class="author">
            <a href="/profile/anneke.bsky.social">Anneke</a>
            <a href="/profile/anneke.bsky.social">@anneke.bsky.social</a>
          </div>
          <p>The lake was completely still this morning. Did not bring the camera, of course.</p>
        </div>
      </div>
    </main>
  </body>
</html>
