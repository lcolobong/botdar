<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home / X (Botdar smoke placeholder)</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0f1419;
        --muted: #536471;
        --border: #eff3f4;
      }
      html[data-theme="dark"] {
        --bg: #000000;
        --fg: #e7e9ea;
        --muted: #71767b;
        --border: #2f3336;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          15px/1.4 -apple-system,
          "Segoe UI",
          Helvetica,
          Arial,
          sans-serif;
      }
      main {
        max-width: 600px;
        margin: 0 auto;
      }
      article {
        display: flex;
        gap: 12px;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #cfd9de;
        flex: none;
      }
      [data-testid="User-Name"] {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      [data-testid="User-Name"] a {
        color: inherit;
        text-decoration: none;
      }
      [data-testid="User-Name"] a + a {
        color: var(--muted);
      }
      p {
        margin: 4px 0 0;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 style="font-size: 20px; padding: 12px 16px; margin: 0">Home</h1>
      <article data-testid="tweet" role="article">
        <div data-testid="Tweet-User-Avatar"><div class="avatar"></div></div>
        <div>
          <div data-testid="User-Name">
            <a href="/daily_quote_bot_48213"><span>Daily Quotes</span></a>
            <a href="/daily_quote_bot_48213"><span>@daily_quote_bot_48213</span></a>
          </div>
          <p>"The only limit is your mind." Follow for more wisdom every hour.</p>
        </div>
      </article>
      <article data-testid="tweet" role="article">
        <div data-testid="Tweet-User-Avatar"><div class="avatar"></div></div>
        <div>
          <div data-testid="User-Name">
            <a href="/marisol_writes"><span>Marisol</span></a>
            <a href="/marisol_writes"><span>@marisol_writes</span></a>
          </div>
          <p>Finished the draft tonight. Coffee count: regrettable.</p>
        </div>
      </article>
    </main>
  </body>
</html>
